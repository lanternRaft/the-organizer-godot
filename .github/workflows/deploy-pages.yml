name: Deploy Web to GitHub Pages

# Every push to *any* branch exports the Godot web build and force-pushes it
# to the gh-pages branch. GitHub Pages serves whatever is on that branch, so
# the last branch to finish building wins (with the concurrency group below,
# an in-flight build is cancelled when a newer push arrives — last one wins).
on:
  push:

concurrency:
  # One shared group for all branches so only a single build/deploy runs at a
  # time, and the most recently pushed branch cancels any older build in
  # flight. This is what makes "last branch to build wins" deterministic
  # instead of the deploy racing on the gh-pages branch.
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Export web and publish to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          # 4.7.0 == the 4.7-stable release, matching the local editor.
          version: 4.7.0
          use-dotnet: false # project is pure GDScript
          include-templates: true

      - name: Import project (warm script/asset cache)
        run: |
          godot --headless --import --quit > /dev/null 2>&1 || true

      - name: Export web build
        # TARGET: use --export-release. --export-debug of the web target has
        # never completed on this runner (4/4 SIGABRTs). Even release is
        # occasionally flaky (Godot headless web export intermittently SIGABRTs
        # ~3s after packing with no output), but a retry on the same machine
        # succeeds, so we attempt a few times. Files are rebuilt fresh each try.
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf build/web && mkdir -p build/web
            echo "Export attempt $attempt"
            godot --headless --export-release "Web" build/web/index.html
            code=$?
            if [ $code -eq 0 ] && [ -f build/web/index.html ] && [ -f build/web/index.wasm ]; then
              echo "✅ Export succeeded (attempt $attempt)"
              exit 0
            fi
            echo "⚠️ Export attempt $attempt failed (exit $code), retrying..."
          done
          echo "❌ Export failed after multiple attempts"
          exit 1

      - name: Deploy to gh-pages (overwrite)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true