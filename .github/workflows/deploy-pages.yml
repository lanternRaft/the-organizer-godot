name: Deploy Web to GitHub Pages

# The web build is produced locally (see README: "Web Build"), committed as
# `export/debug/`, and this workflow simply publishes whatever is in that
# directory to the gh-pages branch root, which GitHub Pages serves directly.
#
# The trigger is restricted to pushes on the `publish` branch that touch files
# under export/debug/, so a push that doesn't change the exported files runs
# nothing at all.
on:
  push:
    branches:
      - publish
    paths:
      - 'export/debug/**'

concurrency:
  # One shared group so only a single deploy runs at a time, and a newer push
  # to publish cancels any older deploy still in flight.
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish export/debug to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages (overwrite)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: export/debug
          force_orphan: true # wipe gh-pages and publish exactly what is in export/debug